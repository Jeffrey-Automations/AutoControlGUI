name: Android device-side helper

# Builds and tests native/android_helper: the fence ledger on the JVM, the instrumentation
# APK, and (stage 4) an emulator run that drives the helper through the package's host
# provider stack. Nothing here holds a secret or publishes anything.

on:
  push:
    branches: ["dev", "main"]
    paths:
      - "native/android_helper/**"
      - ".github/workflows/android-helper.yml"
      - "je_auto_control/utils/agent_runtime/android_*.py"
  pull_request:
    branches: ["main"]
    paths:
      - "native/android_helper/**"
      - ".github/workflows/android-helper.yml"
      - "je_auto_control/utils/agent_runtime/android_*.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-helper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fence-ledger:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        # nosemgrep: yaml.github-actions.security.third-party-action-not-pinned-to-commit-sha.third-party-action-not-pinned-to-commit-sha
        uses: gradle/actions/setup-gradle@v4  # NOSONAR githubactions:S7637
        with:
          gradle-version: "8.11.1"

      - name: Test the fence ledger on the JVM
        run: gradle --no-daemon -p native/android_helper :core:test

  instrumentation-app:
    # The runner image ships the Android SDK (ANDROID_HOME); the debug APK is kept for the
    # emulator stage. Building it proves the app compiles against the ledger and protocol.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        # nosemgrep: yaml.github-actions.security.third-party-action-not-pinned-to-commit-sha.third-party-action-not-pinned-to-commit-sha
        uses: gradle/actions/setup-gradle@v4  # NOSONAR githubactions:S7637
        with:
          gradle-version: "8.11.1"

      - name: Build the instrumentation APK
        run: gradle --no-daemon -p native/android_helper :app:assembleDebug

      - name: Keep the APK for the emulator stage
        uses: actions/upload-artifact@v6
        with:
          name: android-helper-debug-apk
          path: native/android_helper/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  emulator:
    # Stage 4: the debug APK on an x86_64 emulator, driven by native/android_helper/emulator_check.py
    # through ManagedAdbServer, AndroidHelperClient and GeteventSource. Emulator evidence only;
    # real-device acceptance stays deferred.
    needs: instrumentation-app
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the package
        run: python -m pip install -e .  # NOSONAR githubactions:S8544  # reason: installs the checked-out project itself

      - uses: actions/download-artifact@v5
        with:
          name: android-helper-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Drive the helper on an emulator
        # nosemgrep: yaml.github-actions.security.third-party-action-not-pinned-to-commit-sha.third-party-action-not-pinned-to-commit-sha
        uses: reactivecircus/android-emulator-runner@v2  # NOSONAR githubactions:S7637
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: sh native/android_helper/emulator_run.sh apk/app-debug.apk
