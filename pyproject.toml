# Rename to build stable version
# This is stable version
[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "je_auto_control"
version = "1.2.0"
authors = [
    { name = "JE-Chen", email = "jechenmailman@gmail.com" },
]
description = "GUI Automation Framework"
requires-python = ">=3.11"
license-files = ["LICENSE"]
dependencies = [
    # Three requirements below carry the same marker, and it excludes exactly
    # one square: Windows on arm64. Neither package publishes a win_arm64
    # wheel, so pip fell back to building from source and CMake could not
    # configure for ARM64 -- twelve minutes, then failure, which is why the
    # runner had to leave the matrix. Nothing in the package needs them at
    # import time, so the marker is all that stood between this project and
    # that machine. PEP 508 markers have no boolean "not", hence "A or B".
    #
    #   opencv-python  no win_arm64 wheel in any version.
    #   cryptography   wheels stop at 46.0.3; our floor >=50.0.0 is a security
    #                  floor (GHSA-537c-gmf6-5ccf, GHSA-g6cj-pr64-35w5) and
    #                  cannot be lowered. 49.0.0 also dropped the Intel-mac
    #                  universal2 wheel, so x86_64 macOS builds from source.
    #   je_open_cv     pure Python, but it depends on opencv-python, so leaving
    #                  it unmarked drags OpenCV back in through the side door.
    #
    # Pillow is deliberately NOT marked: it has always shipped win_arm64
    # wheels and was never a blocker. Re-check upstream in ten seconds, no
    # runner required:
    #
    #   pip install --dry-run --only-binary=:all: --platform win_arm64 \
    #       --python-version 3.12 --target /tmp/probe \
    #       'opencv-python>=4.8,<6' 'cryptography>=50.0.0'
    #
    # When both resolve, drop the marker from all three lines. Progress.md
    # records what Windows arm64 gives up in the meantime.
    "je_open_cv==0.0.22; sys_platform != 'win32' or platform_machine != 'ARM64'",
    # je_open_cv leaves opencv-python unpinned; bound the major so a new
    # OpenCV release cannot silently change cv2 return shapes under us.
    "opencv-python>=4.8,<6; sys_platform != 'win32' or platform_machine != 'ARM64'",
    # Pillow 13.0.0 fixes the 12.x advisories (critical: GHSA-v9pv-5gc8-w2m6,
    # GHSA-5x8w-8jj5-q52h).
    "pillow==13.0.0",
    "pyobjc-core==12.2.2;platform_system=='Darwin'",
    "pyobjc==12.2.2;platform_system=='Darwin'",
    # The BSDs run the same X11 stack, and platform_system is the kernel
    # name there ("FreeBSD", "OpenBSD", "NetBSD"), so a Linux-only marker
    # left the X11 backend without its one dependency on every one of them.
    "python-Xlib==0.33;platform_system=='Linux' or platform_system=='FreeBSD' or platform_system=='OpenBSD' or platform_system=='NetBSD'",
    "mss==10.2.0",
    "defusedxml==0.7.1",
    "cryptography>=50.0.0; sys_platform != 'win32' or platform_machine != 'ARM64'"
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: X11 Applications",
    "Operating System :: OS Independent"
]

[project.scripts]
je_auto_control = "je_auto_control.cli:main"
je_auto_control_mcp = "je_auto_control.utils.mcp_server.__main__:main"

[project.entry-points.pytest11]
# A top-level module that imports only pytest: as a submodule of the package
# it made every pytest start-up on the machine import the whole facade.
je_auto_control = "je_auto_control_pytest"

[project.urls]
Homepage = "https://github.com/Integration-Automation/AutoControlGUI"
Documentation = "https://autocontrol.readthedocs.io/en/latest/"
Code = "https://github.com/Integration-Automation/AutoControlGUI"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools]
py-modules = ["je_auto_control_pytest"]

[tool.setuptools.packages]
find = { namespaces = false }

[tool.setuptools.package-data]
"je_auto_control" = ["py.typed"]
"je_auto_control.utils.remote_desktop" = [
    "web_viewer/*.html",
    "web_viewer/*.js",
    "web_viewer/*.svg",
    "web_viewer/*.webmanifest",
    "web_viewer/mic-worklet.js",
]

"je_auto_control.utils.rest_api" = [
    "dashboard/*.html",
    "dashboard/*.css",
    "dashboard/*.js",
]

[project.optional-dependencies]
gui = ["PySide6==6.12.0; python_version >= '3.12'", "PySide6==6.11.2; python_version < '3.12'"]
webrtc = ["aiortc>=1.14.0", "av>=14.0.0"]
signaling = ["fastapi>=0.115", "starlette>=1.0.1", "uvicorn>=0.32"]
discovery = ["zeroconf>=0.149.16"]
# Security floor: utils/pdf opens PDFs the caller hands it, and every pypdf
# before 6.21.4 has a malformed-file infinite loop, long runtime or memory
# blow-up (xref tables and streams, page trees, outlines, form fields,
# content streams, encrypted files, /ToUnicode, CID widths, XForms).
pdf = ["pypdf>=6.21.4"]
office = ["openpyxl>=3.1", "python-docx>=1.1", "python-pptx>=0.6"]
fuzzy = ["rapidfuzz>=3.0"]
s3 = ["boto3>=1.34"]
locale = ["babel>=2.12"]
audio = ["pycaw>=20240210"]

# Lock-only security floor for a transitive dependency (uv.lock; the wheel
# metadata is unchanged). dnspython 2.9.0 fixes the advisory in 2.8.0, and 2.9.2
# the excessive memory and CPU use in earlier releases.
[tool.uv]
constraint-dependencies = ["dnspython>=2.9.2"]

# CLAUDE.md's 120-character line limit. Without this table CI's `ruff check`
# ran the default rule set, which has no E501, so the documented limit was
# enforced by nothing. Lines ending in a pragma (`# noqa`, `# nosec`) are
# exempt by ruff's own rule, since a marker cannot move to another line.
[tool.ruff]
line-length = 120

# The rule set is written out rather than taken from ruff's default: ruff 0.16
# widened its default to pyupgrade, isort, RUF, SIM, DTZ and more, and the same
# tree then reported 13,934 findings instead of none. E4/E7/E9/F is the default
# this project was linted against; E501 is the documented line limit.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "E501"]

[tool.bandit]
exclude_dirs = [
    "test", "docs", ".venv", "build", "dist",
    # UI translation dicts — strings like "Token:" / "Bearer 權杖:" trip
    # B105 (hardcoded-password) heuristics. They are not credentials and
    # don't flow into any auth code; exclude wholesale.
    "language_wrapper",
]
# B101 (use of assert) — pytest test code intentionally uses assert.
# Library code is enforced by CLAUDE.md (no assert in non-test code).
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["test/unit_test/headless", "test/unit_test/flow_control"]
addopts = "--strict-markers --strict-config"
# Only test_*.py are real tests. The *_test.py files under test/unit_test/ are
# manual demo scripts whose module bodies drive the real mouse/keyboard; pytest's
# default python_files matches *_test.py, so collecting an explicit path (e.g.
# `pytest test/unit_test/`) would import and execute them. testpaths does not
# protect against this — it is ignored once a path argument is given.
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["je_auto_control", "je_auto_control_pytest"]
omit = ["*/gui/*", "*/language_wrapper/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Two decimals because this number is what the floor below is set from, and at
# the default precision the whole matrix printed "70%" while the squares ran
# 69.67 to 70.97 — the floor had to be read out of the XML artifacts instead of
# the log. It also tightens `fail_under`: coverage lets a total within
# 10**-precision of the floor pass, which at precision 0 is a whole point of
# slack under a ratchet.
precision = 2
# A ratchet, not a target. The rule is that this number is raised to the
# measured minimum whenever the suite has earned it, so coverage the tests
# already provide cannot be given back unnoticed.
#
# 35 was the first measured baseline and then sat still while the suite grew
# past it, which left ~15 points unguarded: every job in the matrix was over
# 50% and CI would still have passed a change that deleted a third of the
# tests. Measured 2026-08-21 on the run for PR #484, the nine-way matrix ran
# 50.26% (ubuntu-22.04 / 3.10) to 51.69% (windows-2022 / 3.14), so the floor
# went to 50.
#
# **Every one of those numbers was ~24 points low.** `quality.yml` measured
# with `pytest --cov`, and this package registers a `pytest11` entry point:
# pytest imports the plugin — and with it the whole facade — before pytest-cov
# starts, so several hundred modules had their import-time lines recorded as
# never executed. Measured 2026-08-23 on one machine, same suite and same
# config, only the start time moved: 52.22% with `pytest --cov`, **72.05%**
# with `coverage run -m pytest`. 11,962 statements. `quality.yml` now runs
# `coverage run`, and the comment there says why it must stay that way.
#
# The number is measured, never guessed, and read from the matrix rather than
# from one machine. Corrected nine-way matrix, measured 2026-08-23 on the run
# for this PR: lowest square ubuntu-22.04 / 3.14 at 69.67%, highest
# windows-2022 / 3.12 at 70.97% — a 1.3-point spread, and Windows is the high
# corner because it is the platform whose backend the facade actually imports.
# Floored to the integer below the lowest square, the same convention that
# turned a 50.26% minimum into 50.
#
# 70 was the destination that number was climbing towards; the maintainer set
# the next one at 80 on 2026-08-23; the climb is recorded in
# docs/updates/2026-08.md (U-20260824-02).
#
# Measured 2026-08-24 on the last run for this PR, after `quality.yml` began
# installing the `[webrtc]` extra and the WebRTC subsystem got its first
# tests: the nine-way matrix runs 75.79% (ubuntu-22.04 / 3.14) to 76.99%
# (windows-2022, 3.11 and 3.12). Windows is still the high corner for the same
# reason as before — the facade imports the backend of the platform it is
# running on. Floored to the integer below the lowest square: 75.
#
# Read that matrix from the "Enforce the coverage floor" step, which is this
# report and therefore the number `fail_under` is compared against. The
# `coverage.xml` artifact is NOT interchangeable with it: `branch = true`
# above puts branches in this total and Cobertura's `line-rate` attribute
# leaves them out, so the XML reads about 2 points higher (77.78% against
# 75.79% on ubuntu-22.04 / 3.14, same run). A floor set from the artifact
# would be a floor the suite cannot clear.
#
# Measured 2026-08-24 on the run that turned every square green, after the
# WebRTC modules, the window and accessibility backends, the hotkey backends
# and the class-callee half of the adapter sweep: the nine-way matrix runs
# 81.40% (ubuntu-22.04 / 3.14) to 82.73% (windows-2022 / 3.12). That clears
# the 80 the maintainer set on 2026-08-23. Floored to the integer below the
# lowest square, the same convention every step of this ratchet has used: 81.
#
# The spread is still about 1.3 points and Windows is still the high corner,
# for the reason given above — the facade imports the backend of the platform
# it is running on, so part of the remainder is unreachable from any single
# square. Raising this number again means covering code that runs on all nine.
fail_under = 81

[tool.mypy]
python_version = "3.11"
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
# CI type-checks the whole package. The modules that do not pass yet are named
# in `test/verify/typing_contract_exempt.txt`, which may only shrink — see
# `test/verify/typing_contract_verify.py` for what that gate does and why the
# scope is written as "everything minus a list" rather than as a path list.
follow_imports = "silent"
exclude = "(^test/|^docs/|^build/)"

[[tool.mypy.overrides]]
# Base dependencies that ship no stubs. These are installed by a plain
# `pip install -e .`, so they are present in every environment the gate runs in
# and only their missing type information needs handling.
# Each name is listed twice on purpose: `foo.*` matches submodules only, so the
# bare `foo` is what covers `import foo` (the same trap documented for numpy
# below, which is where it was first paid for).
module = [
    "cv2", "cv2.*",
    "je_open_cv", "je_open_cv.*",
    "defusedxml", "defusedxml.*",
    "mss", "mss.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Every third-party module OUTSIDE the base dependency set, forced to `Any`.
#
# This is what makes the gate mean the same thing everywhere. These modules are
# optional extras (`[gui]`, `[webrtc]`, `[office]`, …) or undeclared per-platform
# backends (pyobjc, Xlib, comtypes, pywin32), so whether mypy can see them
# depends on which extras the machine happens to have installed. Measured: a dev
# checkout with `[gui]` and `[webrtc]` present disagrees with a bare
# `pip install -e .` about 38 modules — 36 Qt modules that pass only because
# PySide6 is absent, and 2 that fail only because babel and pytest are. A gate
# that flips on `pip install` is not a gate, so the contract does not look
# inside any of them.
#
# `follow_imports = "skip"` (not just `ignore_missing_imports`) is the operative
# setting: ignoring a missing import still lets mypy use the real package when
# it IS installed, which is exactly the environment-dependence being removed.
# Our own signatures and logic stay checked; only calls into these libraries go
# unchecked, which is where they already were before the scope widened.
module = [
    # [gui]
    "PySide6", "PySide6.*",
    # [webrtc] / [signaling] / [discovery]
    "aiortc", "aiortc.*", "av", "av.*",
    "fastapi", "fastapi.*", "uvicorn", "uvicorn.*",
    "pydantic", "pydantic.*", "zeroconf", "zeroconf.*",
    # [pdf] / [office] / [fuzzy] / [s3] / [locale] / [audio]
    "pypdf", "pypdf.*", "openpyxl", "openpyxl.*",
    "docx", "docx.*", "pptx", "pptx.*",
    "rapidfuzz", "rapidfuzz.*", "boto3", "boto3.*",
    "babel", "babel.*", "pycaw", "pycaw.*",
    # macOS backends (pyobjc)
    "objc", "objc.*", "Quartz", "Quartz.*", "AppKit", "AppKit.*",
    "ApplicationServices", "ApplicationServices.*",
    "CoreFoundation", "CoreFoundation.*",
    # Linux X11 / Windows COM and service backends
    "Xlib", "Xlib.*", "comtypes", "comtypes.*",
    "win32event", "win32service", "win32serviceutil",
    # OCR / vision / LLM / agent backends
    "pytesseract", "pytesseract.*", "easyocr", "easyocr.*",
    "paddleocr", "paddleocr.*", "anthropic", "anthropic.*",
    "openai", "openai.*",
    # device, audio and observability backends
    "usb", "usb.*", "sounddevice", "sounddevice.*",
    "vgamepad", "vgamepad.*", "psutil", "psutil.*",
    "opentelemetry", "opentelemetry.*",
    "uiautomator2", "uiautomator2.*", "adbutils", "adbutils.*", "wda", "wda.*",
    # dev-time integrations, absent from a runtime install
    "pytest", "pytest.*", "behave", "behave.*",
    "send2trash", "send2trash.*",
    "je_web_runner", "je_web_runner.*",
]
follow_imports = "skip"
# Required, and for the same reason the numpy block below needs it: `skip` is
# ignored for `.pyi` files on its own. PySide6 ships inline stubs, so without
# this the Qt types are read anyway and 26 GUI modules go on failing wherever
# the `[gui]` extra is installed — which is the whole disagreement this block
# exists to remove.
follow_imports_for_stubs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy's stubs use `type` statements, which mypy rejects while parsing under
# python_version below 3.12 — skip them; the stable API does not expose numpy types.
# The top-level `numpy` module must be listed explicitly: `numpy.*` only matches
# submodules, so numpy>=2.5's PEP 695 statements in numpy/__init__.pyi would leak.
# `follow_imports_for_stubs` is required — otherwise `follow_imports = skip` is
# ignored for .pyi files and mypy parses (and chokes on) the numpy stub anyway.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The strict tier: every function fully annotated, every generic container
# parameterised. It holds each module written since v0.0.225 (plus the pytest
# plugin that ships beside the package), so new code starts at this depth
# instead of at the package-wide floor above, and an older module joins by
# being fixed and named here.
#
# The list is checked against the tree, not remembered:
# `test/unit_test/headless/test_typing_modernization_contract.py` fails when a
# module exists that is neither in `test/verify/typing_strict_baseline.txt`
# (the modules that predate this tier) nor matched below. A package that is new
# as a whole is named with `.*` as well, so a file added to it is covered the
# day it is written. Nothing here loosens a setting from `[tool.mypy]`.
module = [
    "je_auto_control.__main__",
    "je_auto_control._export_bindings",
    "je_auto_control._lazy_exports",
    "je_auto_control.android",
    "je_auto_control.android.apps",
